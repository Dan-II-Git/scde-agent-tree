<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCDE Internal Budget Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/dashboard.css" />
<link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
<script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js"></script>
<script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-text">SCDE Finance</span>
    <span class="brand-tag">Internal</span>
  </div>
  <div class="status" id="status">checking…</div>
</header>

<main class="grid">
  <section class="panel">
    <header class="panel-header">
      <fieldset class="radio-group header-radio" id="view-tabs">
        <label><input type="radio" name="view" value="rollup" checked> Rollup (Org &rarr; Fund &rarr; FA &rarr; CI)</label>
        <label><input type="radio" name="view" value="budget"> Budget vs Actuals (FM)</label>
        <label><input type="radio" name="view" value="fund"> Agency Budget by Fund</label>
        <label><input type="radio" name="view" value="commitments"> Open Commitments</label>
        <label><input type="radio" name="view" value="expenditures"> Expenditures (FI Ledger)</label>
      </fieldset>
      <div class="header-controls">
        <fieldset class="radio-group header-radio header-radio-secondary" id="groupby-tabs">
          <span class="header-radio-label">Group by</span>
          <label><input type="radio" name="groupby" value="org" checked> Org Chart</label>
          <label><input type="radio" name="groupby" value="fa"> Functional Area</label>
        </fieldset>
        <fieldset class="radio-group header-radio header-radio-secondary" id="rollup-mode-tabs">
          <span class="header-radio-label">Layout</span>
          <label><input type="radio" name="rollupmode" value="tree" checked> Tree</label>
          <label><input type="radio" name="rollupmode" value="pivot"> Pivot</label>
        </fieldset>
        <label class="control">
          FY
          <select id="fy"></select>
        </label>
      </div>
    </header>
    <section class="output-panel" id="output">
      <div class="output-placeholder">Loading…</div>
    </section>
  </section>
</main>

<script src="/static/dashboard.js"></script>
</body>
</html>
