<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCDE Finance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-text">SCDE Finance Dashboard</span>
  </div>
  <div class="status" id="status">checking…</div>
</header>

<main class="grid">
  <section class="panel map-panel">
    <header class="panel-header">
      <h2>SC Districts</h2>
      <div class="header-controls">
        <label class="control">
          District
          <select id="map-district"></select>
        </label>
        <label class="control">
          FY
          <select id="map-fy"></select>
        </label>
        <fieldset class="radio-group header-radio" id="report-type-radio">
          <label><input type="radio" name="report-type" value="detail" checked> Detail</label>
          <label><input type="radio" name="report-type" value="multi-fy"> Multi-Year</label>
          <label><input type="radio" name="report-type" value="ytd"> YTD</label>
        </fieldset>
        <fieldset class="radio-group header-radio">
          <label><input type="radio" name="compare-mode" value="table" checked> Table</label>
          <label><input type="radio" name="compare-mode" value="chart"> Chart</label>
        </fieldset>
        <button class="header-btn" data-action="district">View district</button>
        <button class="header-btn" data-action="compare">Compare all</button>
        <button class="header-btn" data-action="whatif-sac" title="SAC What-If Scenario — opens in a new tab">What-If SAC</button>
      </div>
    </header>
    <div id="map"></div>
    <div class="legend" id="map-legend"></div>
  </section>
</main>

<section class="output-panel" id="output">
  <div class="output-placeholder">
    Loading Single-FY Comparison (default)…
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/dashboard.js" type="module"></script>
</body>
</html>
